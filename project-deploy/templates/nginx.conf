# ============================================================
# 前端 Nginx 配置：/api 分流到后端 + 静态托管 + SPA fallback
# 替换占位符：{{PROJECT}} {{API_PORT}}
# 内部监听固定 5173，对外端口由 docker-compose 映射
# ============================================================
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen       5173;
        server_name  _;

        location /api {
            # 动态解析容器名：resolver 用 docker 内置 DNS，变量形式触发每次请求按需解析
            # 容器重建 IP 变化后，最多 valid=30s 内自动恢复，不再 502
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend http://{{PROJECT}}-api:{{API_PORT}};
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
